{% extends "base.html" %}

{% block title %}Editar cliente{% endblock %}
{% block page_title %}Editar cliente{% endblock %}

{% block content %}

<div class="form-box">
    <form method="POST">
        <div class="form-grid">
            <div>
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ cliente[1] }}" required>
            </div>

            <div>
                <label>Apellido</label>
                <input type="text" name="apellido" value="{{ cliente[2] }}" required>
            </div>

            <div>
                <label>DNI</label>
                <input type="text" name="dni" value="{{ cliente[3] }}">
            </div>

            <div>
                <label>Email</label>
                <input type="email" name="email" value="{{ cliente[4] }}">
            </div>

            <div>
                <label>Teléfono</label>
                <input type="text" name="telefono" value="{{ cliente[5] }}">
            </div>

            <div>
                <label>Fecha de nacimiento</label>
                <input type="date" name="fecha_nacimiento" value="{{ cliente[6] }}">
            </div>

            <div>
                <label>Dirección</label>
                <input type="text" name="direccion" value="{{ cliente[7] }}">
            </div>

            <div>
                <label>Localidad</label>
                <input type="text" name="localidad" value="{{ cliente[8] }}">
            </div>
        </div>

        <br>

        <label>Observaciones</label>
        <textarea name="observaciones" rows="4">{{ cliente[9] }}</textarea>

        <br><br>

        <button class="btn" type="submit">Actualizar cliente</button>
        <a class="btn btn-secondary" href="{{ url_for('cliente.listar_clientes') }}">Volver</a>
    </form>
</div>

{% endblock %}
