{% extends "base.html" %}

{% block title %}Nuevo turno{% endblock %}
{% block page_title %}Nuevo turno{% endblock %}

{% block content %}

<div class="form-box">
    <form method="POST">
        <div class="form-grid">
            <div>
                <label>Cliente</label>
                <select name="cliente_id" required>
                    {% for c in clientes %}
                        <option value="{{ c[0] }}">
                            {{ c[2] }}, {{ c[1] }} - DNI {{ c[3] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Técnico</label>
                <select name="tecnico_id">
                    <option value="">Sin asignar</option>
                    {% for t in tecnicos %}
                        <option value="{{ t[0] }}">{{ t[1] }} {{ t[2] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Equipo en reparación</label>
                <select name="equipo_id">
                    <option value="">Sin equipo asociado</option>
                    {% for e in equipos %}
                        <option value="{{ e[0] }}">
                            {{ e[1] }} {{ e[2] }} - {{ e[3] }} {{ e[4] }} - Serie {{ e[5] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Fecha y hora</label>
                <input type="datetime-local" name="fecha_turno" required>
            </div>

            <div>
                <label>Estado</label>
                <select name="estado" required>
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmado">Confirmado</option>
                    <option value="cancelado">Cancelado</option>
                    <option value="asistio">Asistió</option>
                    <option value="no_asistio">No asistió</option>
                </select>
            </div>
        </div>

        <br>

        <label>Observación</label>
        <textarea name="observacion" rows="4"></textarea>

        <br><br>

        <button class="btn" type="submit">Guardar turno</button>
        <a class="btn btn-secondary" href="{{ url_for('turno.listar_turnos') }}">Volver</a>
    </form>
</div>

{% endblock %}
