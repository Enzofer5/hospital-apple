{% extends "base.html" %}

{% block title %}Nueva reparación{% endblock %}
{% block page_title %}Nueva reparación{% endblock %}

{% block content %}

<div class="form-box">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-grid">
            <div>
                <label>Cliente</label>
                <select name="cliente_id" required>
                    {% for c in clientes %}
                        <option value="{{ c[0] }}">
                            {{ c[2] }}, {{ c[1] }} - DNI {{ c[3] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Técnico asignado</label>
                <select name="tecnico_id">
                    <option value="">Sin asignar</option>
                    {% for t in tecnicos %}
                        <option value="{{ t[0] }}">{{ t[1] }} {{ t[2] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Marca</label>
                <input type="text" name="marca" required>
            </div>

            <div>
                <label>Modelo</label>
                <input type="text" name="modelo" required>
            </div>

            <div>
                <label>N° de serie / IMEI</label>
                <input type="text" name="nro_serie">
            </div>

            <div>
                <label>Fotos antes (podés elegir varias)</label>
                <input type="file" name="fotos_antes[]" accept="image/*" multiple>
            </div>

            <div>
                <label>Fecha y hora del turno (opcional)</label>
                <input type="datetime-local" name="fecha_turno">
            </div>
        </div>

        <p style="color: var(--text-secondary); margin-top: 8px;">
            Si cargás una fecha, se crea automáticamente un turno en la Agenda para ese día y hora.
        </p>

        <br>

        <h3>Mano de obra inicial</h3>

        <div class="form-grid">
            <div>
                <label>Trabajo</label>
                <select name="mano_obra_id">
                    <option value="">Sin mano de obra inicial</option>
                    {% for m in mano_obra %}
                        <option value="{{ m[0] }}">
                            {{ m[1] }} - ${{ m[2] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Precio aplicado (USD)</label>
                <input type="number" step="0.01" name="precio_aplicado" placeholder="Ej: 50">
            </div>
        </div>

        <br>

        <label>Estado inicial del equipo</label>
        <textarea name="descripcion_estado" rows="4"></textarea>

        <br><br>

        <label>Falla declarada por el cliente</label>
        <textarea name="falla_declarada" rows="4"></textarea>

        <br><br>

        <button class="btn" type="submit">Guardar reparación</button>
        <a class="btn btn-secondary" href="{{ url_for('reparacion.listar_reparaciones') }}">Volver</a>
    </form>
</div>

{% endblock %}
