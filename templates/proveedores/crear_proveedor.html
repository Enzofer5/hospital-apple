{% extends "base.html" %}

{% block title %}Crear proveedor{% endblock %}
{% block page_title %}Crear proveedor{% endblock %}

{% block content %}

<div class="form-box">
    <form method="POST">
        <div class="form-grid">
            <div>
                <label>Nombre</label>
                <input type="text" name="nombre" required>
            </div>

            <div>
                <label>CUIT</label>
                <input type="text" name="cuit">
            </div>

            <div>
                <label>Email</label>
                <input type="email" name="email">
            </div>

            <div>
                <label>Teléfono</label>
                <input type="text" name="telefono">
            </div>

            <div>
                <label>Dirección</label>
                <input type="text" name="direccion">
            </div>
        </div>

        <br>

        <button class="btn" type="submit">Guardar proveedor</button>
        <a class="btn btn-secondary" href="{{ url_for('proveedor.listar_proveedores') }}">Volver</a>
    </form>
</div>

{% endblock %}
