<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elegir nueva contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <img class="auth-logo-img" src="{{ url_for('static', filename='img/logo.png') }}" alt="Apple Hospital">
        <div class="auth-logo">Apple Hospital</div>
        <div class="auth-subtitle">Elegí tu nueva contraseña</div>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Nueva contraseña</label>
            <input type="password" name="password" minlength="6" required>

            <br><br>

            <label>Repetir nueva contraseña</label>
            <input type="password" name="password_confirmar" minlength="6" required>

            <br><br>

            <button class="btn" type="submit">Guardar contraseña</button>
        </form>
    </div>
</div>

</body>
</html>
